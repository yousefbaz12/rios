[project]
name = "rios"
version = "0.1.0"
description = "Research Intelligence Operating System"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "chainlit>=1.3",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rios = "rios.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rios", "rios.core", "rios.tools"]